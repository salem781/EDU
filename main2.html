
<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <title>EDU Story</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="stail.css" rel="stylesheet">
  </head>
  

  <body class="bg-light">
    <style>

.bg-light {
    --bs-bg-opacity: 1;
    background-image: url(open-book-with-fairytale-scene.jpg);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}
body{
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}
.text-primary{
    background-color: aliceblue;
    background-repeat:space;
    color: rgb(36, 193, 232);
    border-radius: 20px 20px 20px 20px;
    
}
.myname{
    background-color: aliceblue;
    background-repeat:space;
   background-clip: content-box;
    border-radius: 20px 20px 20px 20px;
    
}




.hamburger {
    font-size: 24px;
    cursor: pointer;
    background: none;
    border: none;
  }
  
.menu ul {
    list-style: none;
    padding: 0;
  }
  
.menu li {
    margin: 10px 0;
  }
  

    </style>
    <div class="container py-5">
      <div class="text-center mb-4">
        <h1 class="text-primary">📚 EDU Story</h1>
        <h5 class="myname">تم الإعداد بواسطة المبرمج / سالم علي الكثيري</h5>
      </div>
      <form method="post" class="bg-white p-4 rounded shadow-sm">
        <div class="mb-3">
          <label class="form-label">📌 عنوان الدرس</label>
          <input type="text" name="pain" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">🧠 ما الذي تريده من الدرس؟</label>
          <input type="text" name="pain2" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">🎓 المستوى التعليمي</label>
          <select name="sex1" class="form-select">
            <option>كبار السن</option>
            <option>الجامعة</option>
            <option>الثانوية</option>
            <option>الأساسية</option>
            <option>المرحلة التمهيدية</option>
          </select>
        </div>

         <div class="mb-3">
          <label class="form-label">🔥 نوع القصة</label>
          <select name="sex4" class="form-select">
            <option>عادية </option>
            <option>غامضة</option>
            <option>حزينة</option>
            <option>سعيدة </option>
            <option>مغامرة </option>
          </select>
         </div>

        <div class="mb-3">
          <label class="form-label">⏱️ طول القصة</label>
          <select name="sex2" class="form-select">
            <option>طويلة جدا</option>
            <option>طويلة</option>
            <option>متوسطة</option>
            <option>قصيرة</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">📄 تفاصيل إضافية</label>
          <input type="text" name="pain3" class="form-control">
          <option value="image"></option>       
        </div>

        <div id="image_field" style="display:none;">
          <label>تحميل صورة الدرس:</label>
          <input type="file" name="image" accept="image/*">
      </div>

        <button type="submit" class="btn btn-primary w-100">✨ أنشئ القصة</button>
      </form>

      <script>
        function toggleMethod(value) {
            document.getElementById('manual_fields').style.display = value === 'manual' ? 'block' : 'none';
            document.getElementById('image_field').style.display = value === 'image' ? 'block' : 'none';
        }
    </script>
      
      {% if story %}
      <div class="card mt-4 shadow-sm">
        <div class="card-header bg-success text-white">🎉 قصتك التعليمية:</div>
        <div class="card-body">
          <p>{{ story }}</p>
        </div>
      </div>
      {% endif %}
    </div>
  </body>
</html>
